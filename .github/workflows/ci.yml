name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      DEMO_MODE: "false"
      SLACK_CLIENT_ID: ci-client
      SLACK_CLIENT_SECRET: ci-secret
      SLACK_TEAM_ID: T_CI
      SLACK_BOT_TOKEN: xoxb-ci-placeholder
      SLACK_CHANNEL_ID: C_CI
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      SUPABASE_STORAGE_BUCKET: hanabi-log-private
      NOTION_ACCESS_TOKEN: secret_ci_placeholder
      NOTION_API_VERSION: 2026-03-11
      NOTION_DATABASE_ID: 212fffe9-1997-4b7c-a631-13629baa8977
      NOTION_DATA_SOURCE_ID: aff207bb-2f47-4f19-beba-ae9556bdf442
      ADMIN_SLACK_USER_IDS: U_CI
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
