name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      slack-sync-postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: slack_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d slack_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      DEMO_MODE: "false"
      SLACK_CLIENT_ID: ci-client
      SLACK_CLIENT_SECRET: ci-secret
      SLACK_TEAM_ID: T_CI
      SLACK_BOT_TOKEN: xoxb-ci-placeholder
      SLACK_CHANNEL_ID: C_CI
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      SUPABASE_STORAGE_BUCKET: hanabi-log-private
      NOTION_OAUTH_CLIENT_ID: ci-notion-client
      NOTION_OAUTH_CLIENT_SECRET: ci-notion-secret
      NOTION_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NOTION_API_VERSION: 2026-03-11
      NOTION_DATABASE_ID: 212fffe9-1997-4b7c-a631-13629baa8977
      NOTION_DATA_SOURCE_ID: aff207bb-2f47-4f19-beba-ae9556bdf442
      ADMIN_SLACK_USER_IDS: U_CI
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          SLACK_SYNC_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/slack_sync_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
